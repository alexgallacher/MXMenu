name: Build

# Every push and PR is compiled on a Mac. Pushing a tag like v0.2.0 also
# publishes a GitHub release with MXMenu.zip, which installed copies update from.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build MXMenu.app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MXMenu
          path: build/MXMenu.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/MXMenu.zip --title "MXMenu ${GITHUB_REF_NAME#v}" --generate-notes
