name: Build

# Every push and PR is compiled on a Mac. A GitHub release with MXMenu.zip
# (which installed copies update from) is published when a tag like v0.2.0 is
# pushed, or when main carries a version in Support/Info.plist with no release yet.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
            gh release view "v$version" >/dev/null 2>&1 || echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MXMenu.app
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MXMenu
          path: build/MXMenu.zip

      - name: Render screenshots
        run: |
          mkdir -p screenshots
          build/MXMenu.app/Contents/MacOS/MXMenu --snapshot screenshots/connected.png
          build/MXMenu.app/Contents/MacOS/MXMenu --snapshot screenshots/disconnected.png --disconnected

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Publish release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v$VERSION" build/MXMenu.zip --target "$GITHUB_SHA" --title "MXMenu $VERSION" --generate-notes
